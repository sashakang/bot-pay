version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bot-pay-postgres
    environment:
      POSTGRES_DB: bot_pay_db
      POSTGRES_USER: bot_pay_user
      POSTGRES_PASSWORD: bot_pay_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_pay_user -d bot_pay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bot-pay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: bot-pay-server
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://bot_pay_user:bot_pay_password@postgres:5432/bot_pay_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      APPROVAL_TOKEN_SECRET: dev-approval-secret-change-in-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
